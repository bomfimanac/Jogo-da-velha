<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moranguinho & Amoras 🍓 Jogo da Velha</title>
    <link rel="icon" href="https://img.icons8.com/emoji/48/strawberry-emoji.png" type="image/png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="floating-decor">🍓</div>
    <div class="floating-decor">🫐</div>
    <div class="floating-decor">🌸</div>
    <div class="floating-decor text-decor">✨</div>
    <div class="floating-decor text-decor">🍰</div>

    <div class="container" id="setupContainer">
        <header>
            <h1>Welcome, Sis!</h1>
            <p class="subtitle">Personalize sua partida ✨</p>
        </header>

        <div class="section-group">
            <p class="section-title">Modo de Jogo</p>
            <div class="options-grid">
                <button type="button" class="select-btn active" id="modePvp">Com uma Amiga 👭</button>
                <button type="button" class="select-btn" id="modeAi">Contra Robô 🤖</button>
            </div>
        </div>

        <div class="section-group hidden" id="difficultyGroup">
            <p class="section-title">Nível do Robô</p>
            <div class="options-grid diff-grid">
                <button type="button" class="select-btn active" data-diff="easy">Fácil 🍰</button>
                <button type="button" class="select-btn" data-diff="medium">Médio ✨</button>
                <button type="button" class="select-btn" data-diff="hard">Imbatível 🔥</button>
            </div>
        </div>

        <div class="players-setup-box">
            <div class="player-card">
                <div class="input-group">
                    <label for="p1Name">Jogador 1:</label>
                    <input type="text" id="p1Name" placeholder="Seu nome... 💕" value="Moranguinho">
                </div>
                <div class="fruit-choice-box">
                    <span class="mini-label">Fruta:</span>
                    <div class="options-grid compact">
                        <button type="button" class="select-btn active" id="p1FruitX">🍓 Morango</button>
                        <button type="button" class="select-btn" id="p1FruitO">🫐 Amora</button>
                    </div>
                </div>
            </div>

            <div class="player-card" id="p2Card">
                <div class="input-group">
                    <label for="p2Name" id="p2Label">Jogador 2:</label>
                    <input type="text" id="p2Name" placeholder="Nome da amiga... 💖" value="Amora Linda">
                </div>
                <div class="fruit-assigned">
                    <span class="mini-label">Fruta designada:</span>
                    <div class="assigned-badge" id="p2FruitBadge">🫐 Amora</div>
                </div>
            </div>
        </div>

        <button class="action-btn" id="startBtn">INICIAR PARTIDA ✨</button>
    </div>

    <div class="container hidden" id="gameContainer">
        <header>
            <h1>Morangolândia</h1>
            <p class="subtitle">Jogo da Velha Clean 💖</p>
        </header>
        
        <div class="status" id="status"></div>

        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>

        <div class="game-actions-group">
            <button class="action-btn secondary" id="resetBtn">Resetar 🍓</button>
            <button class="action-btn outline" id="backToHomeBtn">Início 🏠</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
